<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>eGain Star Chart Hunt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128301;</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --void:#080b14; --panel:#111726; --panel-2:#161d30; --line:#212b44;
    --ink:#e9edf7; --muted:#8d99b6; --brass:#d9a537; --brass-dim:#8a6a22;
    --ok:#57c08a; --alert:#e4695a; --shadow:0 18px 48px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{background:var(--void)}
  body{margin:0;color:var(--ink);font-family:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding-inline:20px;padding-block:32px 52px}
  .wrap.wide{max-width:1060px}
  .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--brass);margin:0 0 12px}
  h1{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:clamp(2.2rem,9vw,3.2rem);
    line-height:1.04;margin:0;text-wrap:balance}
  h1 .sub{display:block;font-family:"Karla",sans-serif;font-size:.85rem;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:13px}
  h2{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance}
  p{margin:0}
  .rule{height:1px;background:linear-gradient(90deg,var(--brass-dim),transparent);margin:24px 0 0;border:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .stack{display:flex;flex-direction:column;gap:18px}
  .stack-sm{display:flex;flex-direction:column;gap:11px}
  label.fld{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  input{width:100%;padding:14px 15px;background:#0b101c;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.02rem;
    letter-spacing:.12em;text-transform:uppercase}
  input::placeholder{color:#4c5773}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  button{font-family:"Karla",sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.06em;
    padding:13px 20px;border-radius:10px;border:1px solid var(--brass);background:var(--brass);
    color:#1a1204;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button[disabled]{opacity:.55;cursor:default}
  button.ghost{background:transparent;color:var(--brass);border-color:var(--brass-dim)}
  button.danger{background:transparent;color:var(--alert);border-color:#5c2a26}
  button.link{background:none;border:none;color:var(--muted);padding:0;font-weight:500;
    text-decoration:underline;font-size:.85rem;letter-spacing:0}
  button.link:hover{color:var(--brass)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .clue{font-family:"Spectral",Georgia,serif;font-size:clamp(1.28rem,5vw,1.66rem);line-height:1.42;
    font-style:italic;margin:0;text-wrap:pretty}
  .clue-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    font-size:12px;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);background:var(--panel-2)}
  .pill.good{color:var(--ok);border-color:#265340}
  .pill.warn{color:var(--brass);border-color:var(--brass-dim)}
  .pill.bad{color:var(--alert);border-color:#5c2a26}
  .msg{border-radius:10px;padding:13px 15px;font-size:.95rem;border:1px solid var(--line);background:var(--panel-2)}
  .msg.bad{border-color:#5c2a26;color:#f0b3ab;background:#1c1113}
  .rail{display:flex;gap:3px;margin-top:16px}
  .rail i{flex:1;height:6px;border-radius:2px;background:#1a2237;display:block}
  .rail i.on{background:var(--brass)}
  .rail i.fin{background:var(--ok)}
  .rail.mini{margin:6px 0 0;gap:2px}
  .rail.mini i{height:5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
  .stn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    display:flex;flex-direction:column;gap:3px}
  .stn.start{border-color:var(--brass-dim)}
  .stn .nm{font-family:"Spectral",Georgia,serif;font-size:1.12rem}
  .stn .pn{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--brass);word-break:break-all}
  .stn .note{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:620px;font-size:.92rem}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:500}
  td.num{font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
  tr.done td{background:rgba(87,192,138,.06)}
  .tname{font-family:"Spectral",Georgia,serif;font-size:1.05rem}
  .mono-sm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
  details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 16px}
  details[open]{padding-bottom:14px}
  summary{cursor:pointer;padding:14px 0;font-weight:700;letter-spacing:.03em}
  .keyline{display:flex;gap:10px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12px;
    color:var(--muted);padding:8px 0;border-top:1px dashed var(--line)}
  .keyline b{color:var(--ink);font-weight:500}
  footer{margin-top:30px;color:var(--muted);font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .hint{color:var(--muted);font-size:.9rem}
  @media (prefers-reduced-motion:reduce){#sky{display:none}}
</style>
</head>

var TOTAL = DATA.total;
var TEAMS = DATA.teams;
var LS = "eg-hunt-";
var view = "home";
var app = document.getElementById("app");
var adminKey = null;   /* set once the organizer passphrase decrypts the key blob */
var adminData = null;
var enc = new TextEncoder();
var dec = new TextDecoder();

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function norm(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function b64(s){ var raw = atob(s), a = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) a[i] = raw.charCodeAt(i); return a; }
function slugName(slug){
  var base = String(slug||"").split("-")[0];
  return base ? base.charAt(0).toUpperCase() + base.slice(1) : "";
}
function clockOf(iso){ if(!iso) return "&mdash;";
  try{ return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }catch(e){ return "--:--"; } }
function railHTML(n,done,mini){
  var out = '<div class="rail'+(mini?" mini":"")+'" aria-hidden="true">';
  for(var i=0;i<TOTAL;i++) out += '<i class="'+(i<n ? (done?"fin":"on") : "")+'"></i>';
  return out+"</div>";
}
function lsGet(k){ try{ var v = localStorage.getItem(LS+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(LS+k); }catch(e){} }
function teamName(id){ for(var i=0;i<TEAMS.length;i++) if(TEAMS[i].id===id) return TEAMS[i].n; return id; }

/* ---------- crypto ---------- */
async function deriveKey(pw){
  var km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function openOne(key, blob){
  var raw = b64(blob);
  try{
    var out = await crypto.subtle.decrypt({name:"AES-GCM", iv:raw.slice(0,12)}, key, raw.slice(12));
    return JSON.parse(dec.decode(out));
  }catch(e){ return null; }
}
async function isFinishSlug(slug){
  var h = await crypto.subtle.digest("SHA-256", enc.encode("finish|"+slug));
  var a = new Uint8Array(h), s = "";
  for(var i=0;i<a.length;i++) s += String.fromCharCode(a[i]);
  return btoa(s) === DATA.finishHash;
}
async function findRecord(key){
  for(var i=0;i<DATA.recs.length;i++){
    var p = await openOne(key, DATA.recs[i]);
    if(p) return p;
  }
  return null;
}

/* ---------- progress store (Supabase, else this device) ---------- */
function liveOn(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }
function supaHeaders(extra){
  var h = {"apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY,
           "Content-Type":"application/json"};
  if(extra) for(var k in extra) h[k] = extra[k];
  return h;
}
function blank(id){ return {team_id:id, team_name:teamName(id), visits:[], finished_at:null}; }

async function loadRec(id){
  if(liveOn()){
    try{
      var r = await fetch(SUPABASE_URL+"/rest/v1/progress?select=*&team_id=eq."+encodeURIComponent(id),
        {headers:supaHeaders()});
      if(r.ok){
        var rows = await r.json();
        if(rows && rows.length){
          var row = rows[0];
          return {team_id:id, team_name:row.team_name||teamName(id),
                  visits:Array.isArray(row.visits)?row.visits:[], finished_at:row.finished_at||null};
        }
        return blank(id);
      }
    }catch(e){}
  }
  return lsGet(id) || blank(id);
}

async function saveRec(rec){
  lsSet(rec.team_id, rec);
  if(!liveOn()) return true;
  var last = rec.visits.length ? rec.visits[rec.visits.length-1] : null;
  var body = [{
    team_id: rec.team_id, team_name: rec.team_name,
    stops: rec.visits.length,
    last_room: last ? last.room : null,
    last_at: last ? last.at : null,
    finished_at: rec.finished_at,
    visits: rec.visits
  }];
  try{
    var r = await fetch(SUPABASE_URL+"/rest/v1/progress?on_conflict=team_id", {
      method:"POST",
      headers:supaHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify(body)
    });
    return r.ok;
  }catch(e){ return false; }
}

async function loadAll(){
  if(liveOn()){
    try{
      var r = await fetch(SUPABASE_URL+"/rest/v1/progress?select=*", {headers:supaHeaders()});
      if(r.ok){
        var out = {}, rows = await r.json();
        rows.forEach(function(row){
          out[row.team_id] = {visits:Array.isArray(row.visits)?row.visits:[],
                              finished_at:row.finished_at||null};
        });
        return {ok:true, recs:out};
      }
    }catch(e){}
    return {ok:false, recs:{}};
  }
  var local = {};
  TEAMS.forEach(function(t){ var r = lsGet(t.id); if(r) local[t.id] = {visits:r.visits, finished_at:r.finished_at}; });
  return {ok:true, recs:local, localOnly:true};
}

/* ---------- star field ---------- */
(function starfield(){
  var c = document.getElementById("sky");
  if(!c || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  var ctx = c.getContext("2d"), stars = [], dpr = Math.min(window.devicePixelRatio||1,2);
  function size(){
    c.width = Math.floor(innerWidth*dpr); c.height = Math.floor(innerHeight*dpr);
    stars = [];
    var n = Math.round((innerWidth*innerHeight)/9000);
    for(var i=0;i<n;i++) stars.push({x:Math.random()*c.width, y:Math.random()*c.height,
      r:(Math.random()*1.15+.25)*dpr, p:Math.random()*6.2832, s:Math.random()*.0016+.0004, h:Math.random()<.12});
  }
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){
      var s = stars[i], a = .22 + .5*(0.5+0.5*Math.sin(s.p + t*s.s));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832);
      ctx.fillStyle = s.h ? "rgba(217,165,55,"+(a*.85).toFixed(3)+")" : "rgba(196,212,246,"+a.toFixed(3)+")";
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  size(); addEventListener("resize",size); requestAnimationFrame(draw);
})();

/* ---------- routing ---------- */
function currentSlug(){
  var h = (location.hash||"").replace(/^#\/?/,"").trim().toLowerCase();
  return /^[a-z]+-[a-z0-9]{4,16}$/.test(h) ? h : "";
}
function route(){
  if(adminOpen()) return renderTracker();
  var slug = currentSlug();
  if(slug) renderStation(slug); else renderHome();
}
function adminOpen(){ try{ return sessionStorage.getItem(LS+"admin")==="1" && !!adminKey; }catch(e){ return false; } }

/* ---------- home ---------- */
function renderHome(){
  view = "home"; app.className = "wrap";
  app.innerHTML =
    '<p class="eyebrow">eGain &middot; Treasure Hunt</p>'+
    '<h1>Star Chart Hunt<span class="sub">14 stops &middot; one route each &middot; the Canteen closes the loop</span></h1>'+
    '<hr class="rule">'+
    '<div class="stack" style="margin-top:24px">'+
      '<div class="card"><div class="stack-sm">'+
        '<h2>Scan the poster in the room you are standing in</h2>'+
        '<p class="hint">Each conference room has its own QR code. Scanning it opens that room&rsquo;s page, '+
        'where your team code releases the next clue. Start at the Canteen.</p>'+
      '</div></div>'+
      '<div class="card"><div class="stack-sm">'+
        '<h2>Rules of the chase</h2>'+
        '<p class="hint">One code per team, all the way round. Clues arrive strictly in order, so nothing '+
        'skips you ahead. When your last clue sends you back to the Canteen, scan it again to stop your clock.</p>'+
      '</div></div>'+
    '</div>'+
    '<footer><span>eGain Treasure Hunt</span><button class="link" id="admin">Organizer access</button></footer>';
  document.getElementById("admin").addEventListener("click", renderGate);
}

/* ---------- station ---------- */
function renderStation(slug){
  view = "station"; app.className = "wrap";
  var name = slugName(slug);
  var saved = lsGet("me");
  app.innerHTML =
    '<p class="eyebrow">eGain Treasure Hunt &middot; Station</p>'+
    '<h1>'+esc(name)+'<span class="sub">'+(saved?"Enter to collect your next clue":"Enter your team code to begin")+'</span></h1>'+
    '<hr class="rule">'+
    '<div class="stack" style="margin-top:24px">'+
      '<div class="card"><form id="f" class="stack-sm" autocomplete="off">'+
        (saved
          ? '<div class="row" style="justify-content:space-between"><span class="pill warn">'+esc(teamName(saved.id))+'</span>'+
            '<button type="button" class="link" id="switch">Not your team?</button></div>'
          : '<div><label class="fld" for="code">Team code</label>'+
            '<input id="code" name="code" type="text" spellcheck="false" maxlength="24" placeholder="16 characters"></div>')+
        '<div class="row"><button id="go" type="submit">'+(saved?"Collect my clue":"Start the hunt")+'</button>'+
        '<span class="hint">'+(saved?"Remembered on this phone.":"Typed once, then remembered on this phone.")+'</span></div>'+
      '</form></div>'+
      '<div id="out"></div>'+
    '</div>'+
    '<footer><span>Solve it together &mdash; no code will skip you ahead.</span>'+
      '<button class="link" id="admin">Organizer access</button></footer>';

  document.getElementById("admin").addEventListener("click", renderGate);
  var sw = document.getElementById("switch");
  if(sw) sw.addEventListener("click", function(){ lsDel("me"); lsDel("held"); renderStation(slug); });

  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var el = document.getElementById("code");
    arrive(slug, el ? el.value : (saved ? saved.code : ""));
  });

  if(saved) showHeld(saved);
}

async function showHeld(saved){
  var out = document.getElementById("out");
  if(!out || out.innerHTML) return;
  var rec = await loadRec(saved.id);
  if(!rec.visits.length) return;
  if(rec.finished_at){ out.innerHTML = finishCard(saved.id, rec.finished_at); return; }
  var held = lsGet("held");
  if(held && held.step === rec.visits.length)
    out.innerHTML = clueCard(held.clue, held.step, rec.visits.length, "Clue you are holding");
}

async function arrive(slug, rawCode){
  var out = document.getElementById("out");
  var btn = document.getElementById("go");
  var code = norm(rawCode);
  if(code.length < 8){
    out.innerHTML = '<div class="msg bad">A team code is 16 letters and digits. Check the slip you were handed.</div>';
    return;
  }
  btn.disabled = true;
  out.innerHTML = '<div class="msg">Checking your route&hellip;</div>';

  var rec0, payload;
  try{
    var key = await deriveKey(code + "|" + slug);
    payload = await findRecord(key);
  }catch(e){
    btn.disabled = false;
    out.innerHTML = '<div class="msg bad">This browser blocked the code check. Try Chrome or Safari, or ask an organizer.</div>';
    return;
  }
  btn.disabled = false;

  if(!payload){
    out.innerHTML = '<div class="msg bad">No clue here for that code. Either a character is mistyped, '+
      'or '+esc(slugName(slug))+' is not a stop on your route.</div>';
    return;
  }

  lsSet("me", {id:payload.t, code:code});
  rec0 = await loadRec(payload.t);
  var done = rec0.visits.length;
  var step = payload.s;               /* 1-based position on this team's route */

  /* Back at the Canteen with every clue unlocked: that is the finish line. */
  if(done >= TOTAL && await isFinishSlug(slug)){
    if(!rec0.finished_at){
      rec0.finished_at = new Date().toISOString();
      rec0.team_name = payload.n;
      await saveRec(rec0);
    }
    out.innerHTML = finishCard(payload.t, rec0.finished_at);
    return;
  }

  if(step <= done){
    out.innerHTML = clueCard(payload.c, step, done, "Clue re-issued");
    return;
  }
  if(step > done + 1){
    out.innerHTML = '<div class="msg bad">'+esc(payload.r)+' is not your next stop. '+
      esc(payload.n)+' has '+done+' of '+TOTAL+' clues &mdash; solve the one you are holding first.</div>';
    return;
  }

  rec0.team_name = payload.n;
  rec0.visits.push({room:payload.r, step:step, at:new Date().toISOString()});
  lsSet("held", {step:step, clue:payload.c});
  var ok = await saveRec(rec0);
  out.innerHTML = clueCard(payload.c, step, rec0.visits.length, step===1 ? "You are away" : esc(payload.r)+" logged") +
    (ok ? "" : '<div class="msg bad" style="margin-top:12px">Your clue is above, but the tracker did not '+
      'record this stop. Show this screen to an organizer.</div>');
}

function clueCard(text, step, done, badge){
  var last = step === TOTAL;
  return '<div class="card">'+
    '<div class="clue-head"><span class="pill '+(last?"warn":"good")+'">'+badge+'</span>'+
    '<span class="tag">clue '+step+' of '+TOTAL+'</span></div>'+
    '<p class="clue">'+esc(text)+'</p>'+
    '<p class="hint" style="margin-top:14px">'+(last
      ? "Name this room, go there, and scan its code one last time to stop your clock."
      : "The answer is a room. Go there and scan the QR code on its poster.")+'</p>'+
    railHTML(done,false)+'</div>';
}

function finishCard(id, at){
  return '<div class="card"><div class="clue-head"><span class="pill good">Treasure reached</span>'+
    '<span class="tag">'+esc(teamName(id))+' &middot; '+clockOf(at)+'</span></div>'+
    '<p class="clue">Fourteen stops, closed in a loop. Tell an organizer you are in &mdash; your finish '+
    'time is already on the tracker.</p>'+
    railHTML(TOTAL,true)+'</div>';
}

/* ---------- organizer gate ---------- */
function renderGate(){
  view = "gate"; app.className = "wrap";
  app.innerHTML =
    '<p class="eyebrow">eGain Treasure Hunt &middot; Organizers</p>'+
    '<h1>Tracker<span class="sub">Live positions for all ten teams</span></h1>'+
    '<hr class="rule">'+
    '<div class="card" style="margin-top:24px"><form id="pf" class="stack-sm">'+
      '<div><label class="fld" for="pass">Organizer passphrase</label>'+
      '<input id="pass" name="pass" type="password" autocomplete="off"></div>'+
      '<div class="row"><button type="submit" id="ub">Unlock</button>'+
      '<button type="button" class="ghost" id="back">Back to the hunt</button></div>'+
      '<p class="hint" id="pmsg"></p>'+
    '</form></div>';
  document.getElementById("back").addEventListener("click", route);
  document.getElementById("pf").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var b = document.getElementById("ub"); b.disabled = true;
    var k = await deriveKey("admin|" + norm(document.getElementById("pass").value));
    var d = await openOne(k, DATA.admin);
    b.disabled = false;
    if(d){
      adminKey = k; adminData = d;
      try{ sessionStorage.setItem(LS+"admin","1"); }catch(e){}
      renderTracker();
    } else {
      document.getElementById("pmsg").textContent = "Wrong passphrase. Ask whoever set the hunt up.";
    }
  });
}

/* ---------- tracker ---------- */
var poll = null;

function renderTracker(){
  view = "tracker"; app.className = "wrap wide";
  if(!adminData){ renderGate(); return; }

  app.innerHTML =
    '<p class="eyebrow">eGain Treasure Hunt &middot; Organizers</p>'+
    '<h1>Tracker<span class="sub">Live positions for all ten teams</span></h1>'+
    '<div class="row" style="margin-top:16px"><span id="conn" class="pill">Loading&hellip;</span>'+
      '<button class="ghost" id="back">Back to the hunt</button></div>'+
    '<hr class="rule">'+
    '<div class="stack" style="margin-top:22px">'+
      '<div class="card" style="padding:0"><div class="scroller"><table id="tbl">'+
        '<thead><tr><th>Team</th><th>Clues unlocked</th><th>Last confirmed at</th>'+
        '<th>Next stop due</th><th>Time</th></tr></thead><tbody></tbody></table></div></div>'+
      '<div class="stack-sm"><h2>Station links</h2>'+
        '<p class="hint">One QR code per room, already printed in the pack. These are the addresses behind them '+
        '&mdash; keep this screen away from players.</p>'+
        '<div class="grid" id="stns"></div></div>'+
      '<details><summary>Route key and team codes</summary><div id="routes"></div></details>'+
      '<div class="card"><div class="stack-sm"><h2>Reset the hunt</h2>'+
        '<p class="hint">Clears every team&rsquo;s progress. Use it after a practice run, not mid-game.</p>'+
        '<div class="row"><button id="rst" class="danger">Clear all progress</button>'+
        '<span class="hint" id="rmsg"></span></div>'+
      '</div></div>'+
    '</div>'+
    '<footer><span>'+(liveOn()
      ? "Refreshes every few seconds. Times use each team&rsquo;s phone clock."
      : "No backend configured, so this shows only what happened on this device.")+'</span></footer>';

  document.getElementById("back").addEventListener("click", function(){
    stopPoll();
    try{ sessionStorage.removeItem(LS+"admin"); }catch(e){}
    adminKey = null; adminData = null;
    route();
  });

  var base = location.href.split("#")[0];
  document.getElementById("stns").innerHTML = adminData.stations.map(function(s,i){
    return '<div class="stn'+(i===0?" start":"")+'"><div class="nm">'+esc(s.name)+'</div>'+
      '<div class="pn">'+esc(base+"#/"+s.slug)+'</div>'+
      (i===0?'<div class="note">start + treasure</div>':'')+'</div>';
  }).join("");

  document.getElementById("routes").innerHTML = TEAMS.map(function(t){
    var r = adminData.routes[t.id] || [];
    return '<div class="keyline"><b>'+esc(t.n)+'</b><span style="color:var(--brass)">'+
      esc(adminData.codes[t.id]||"")+'</span><span>'+r.map(esc).join(" &rarr; ")+' &rarr; Canteen</span></div>';
  }).join("");

  var rbtn = document.getElementById("rst"), armed = false;
  rbtn.addEventListener("click", async function(){
    if(!armed){ armed = true; rbtn.textContent = "Tap again to confirm";
      document.getElementById("rmsg").textContent = "This cannot be undone."; return; }
    rbtn.disabled = true;
    document.getElementById("rmsg").textContent = "Clearing&hellip;";
    for(var i=0;i<TEAMS.length;i++){
      lsDel(TEAMS[i].id);
      if(liveOn()){
        try{
          await fetch(SUPABASE_URL+"/rest/v1/progress?team_id=eq."+encodeURIComponent(TEAMS[i].id),
            {method:"DELETE", headers:supaHeaders({"Prefer":"return=minimal"})});
        }catch(e){}
      }
    }
    rbtn.disabled = false; armed = false; rbtn.textContent = "Clear all progress";
    document.getElementById("rmsg").textContent = "Progress cleared.";
    refresh();
  });

  paint({});
  refresh();
  stopPoll();
  if(liveOn()) poll = setInterval(refresh, 6000);
}

function stopPoll(){ if(poll){ clearInterval(poll); poll = null; } }

async function refresh(){
  if(view !== "tracker") { stopPoll(); return; }
  var res = await loadAll();
  var conn = document.getElementById("conn");
  if(conn){
    if(res.localOnly){ conn.textContent = "This device only"; conn.className = "pill warn"; }
    else if(res.ok){ conn.textContent = "Live"; conn.className = "pill good"; }
    else { conn.textContent = "Backend unreachable"; conn.className = "pill bad"; }
  }
  paint(res.recs);
}

function paint(recs){
  var tb = document.querySelector("#tbl tbody");
  if(!tb) return;
  var rows = TEAMS.map(function(t){
    var r = recs[t.id] || {};
    var v = Array.isArray(r.visits) ? r.visits : [];
    return {t:t, n:v.length, fin:r.finished_at||null, last:v.length?v[v.length-1]:null};
  });
  rows.sort(function(a,b){
    if(!!a.fin !== !!b.fin) return a.fin ? -1 : 1;
    if(a.fin && b.fin) return a.fin < b.fin ? -1 : 1;
    if(a.n !== b.n) return b.n - a.n;
    if(a.last && b.last) return a.last.at < b.last.at ? -1 : 1;
    return 0;
  });

  tb.innerHTML = rows.map(function(x){
    var where, due, route = (adminData && adminData.routes[x.t.id]) || [];
    if(x.fin){ where = '<span class="pill good">Treasure found</span>'; due = "&mdash;"; }
    else if(x.n === 0){ where = '<span class="pill">Not started</span>'; due = route[0] || "Canteen"; }
    else if(x.n >= TOTAL){ where = esc(x.last.room)+' <span class="pill warn">final clue</span>'; due = "Canteen"; }
    else { where = esc(x.last.room); due = esc(route[x.n] || "?"); }
    return '<tr class="'+(x.fin?"done":"")+'">'+
      '<td><div class="tname">'+esc(x.t.n)+'</div></td>'+
      '<td style="min-width:170px"><span class="num">'+x.n+' / '+TOTAL+'</span>'+railHTML(x.n,!!x.fin,true)+'</td>'+
      '<td>'+where+'</td><td>'+due+'</td>'+
      '<td class="num">'+(x.fin ? clockOf(x.fin) : (x.last ? clockOf(x.last.at) : "&mdash;"))+'</td></tr>';
  }).join("");
}

/* ---------- boot ---------- */
addEventListener("hashchange", function(){ stopPoll(); route(); });
try{ sessionStorage.removeItem(LS+"admin"); }catch(e){}
route();
</script>
