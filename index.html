<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
  :root{
    /* eGain brand tokens, taken from egain.com */
    --brand:#B91D8F;
    --brand-deep:#8E1370;
    --brand-tint:#FEF0FD;
    --brand-line:#FFE1FD;
    --aqua:#007FAD;
    --aqua-tint:#E6F6FA;
    --yellow:#FFD818;
    --ink:#141414;
    --ink-2:#4B4B4B;
    --muted:#6E6E6E;
    --bg:#FFFFFF;
    --bg-2:#F9F9F9;
    --line:#E6E6E6;
    --line-2:#DBDBDB;
    --ok:#12784E;
    --ok-tint:#EAF7F0;
    --alert:#B5322A;
    --alert-tint:#FDF0EF;
    --band:linear-gradient(105deg,#FBC9BE 0%,#FA8AC8 30%,#EE5BBE 55%,#C42BA6 80%,#B91D8F 100%);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}

  .mast{border-bottom:1px solid var(--line);background:var(--bg)}
  .mast-in{max-width:1060px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;
    justify-content:space-between;gap:16px}
  .mast img{height:32px;width:auto;display:block}
  .mast .ev{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  .band{background:var(--band);color:#fff;position:relative;overflow:hidden}
  .band-in{max-width:620px;margin:0 auto;padding:34px 20px 36px;position:relative;z-index:1}
  .band.wide .band-in{max-width:1060px}
  .band canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.65}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(255,255,255,.92);margin:0 0 10px}
  h1{font-size:clamp(2rem,7.5vw,2.9rem);font-weight:700;line-height:1.08;letter-spacing:-.02em;
    margin:0;text-wrap:balance;color:#fff}
  .band .sub{display:block;font-size:.9rem;font-weight:600;letter-spacing:.02em;
    color:rgba(255,255,255,.94);margin-top:10px}

  .wrap{max-width:620px;margin:0 auto;padding:26px 20px 56px}
  .wrap.wide{max-width:1060px}
  h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
  p{margin:0}

  .card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:20px}
  .card.tint{background:var(--brand-tint);border-color:var(--brand-line)}
  .card.flat{background:var(--bg-2);border-color:var(--line)}
  .stack{display:flex;flex-direction:column;gap:16px}
  .stack-sm{display:flex;flex-direction:column;gap:10px}

  label.fld{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:7px}
  input{width:100%;padding:13px 14px;background:#fff;color:var(--ink);border:1px solid var(--line-2);
    border-radius:8px;font-family:var(--mono);font-size:1.02rem;letter-spacing:.1em;text-transform:uppercase}
  input.txt{font-family:inherit;text-transform:none;letter-spacing:normal}
  input::placeholder{color:#A8A8A8;letter-spacing:.08em}
  input:focus{border-color:var(--brand)}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  button{font-family:inherit;font-size:.95rem;font-weight:700;padding:12px 22px;border-radius:999px;
    border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
  button:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  button[disabled]{opacity:.5;cursor:default}
  button.ghost{background:#fff;color:var(--brand)}
  button.ghost:hover{background:var(--brand-tint);border-color:var(--brand)}
  button.go{background:var(--ok);border-color:var(--ok)}
  button.go:hover{background:#0C5C3B;border-color:#0C5C3B}
  button.danger{background:#fff;color:var(--alert);border-color:#E3B7B3}
  button.danger:hover{background:var(--alert-tint);border-color:var(--alert)}
  button.link{background:none;border:none;color:var(--brand);padding:0;font-weight:600;
    text-decoration:underline;font-size:.85rem;border-radius:0}
  button.link:hover{background:none;color:var(--brand-deep)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .clue-card{background:var(--brand-tint);border:1px solid var(--brand-line);
    border-left:4px solid var(--brand);border-radius:10px;padding:20px 22px}
  .clue{font-size:clamp(1.18rem,4.4vw,1.42rem);line-height:1.45;font-weight:600;margin:0;
    letter-spacing:-.01em;text-wrap:pretty;color:var(--ink)}
  .clue-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
  .pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:11.5px;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);
    background:#fff;color:var(--ink-2)}
  .pill.brand{color:#fff;background:var(--brand);border-color:var(--brand)}
  .pill.good{color:var(--ok);background:var(--ok-tint);border-color:#BFE3D2}
  .pill.bad{color:var(--alert);background:var(--alert-tint);border-color:#E3B7B3}
  .pill.aqua{color:var(--aqua);background:var(--aqua-tint);border-color:#B6E3EE}

  .msg{border-radius:8px;padding:13px 15px;font-size:.94rem;border:1px solid var(--line);background:var(--bg-2)}
  .msg.bad{border-color:#E3B7B3;background:var(--alert-tint);color:#8C2620}

  .halt{border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);padding:26px 22px;text-align:center}
  .halt h2{font-size:1.35rem;margin-bottom:8px}
  .halt p{color:var(--ink-2)}
  .win{border:1px solid #BFE3D2;border-radius:10px;background:var(--ok-tint);padding:28px 22px;text-align:center}
  .win .who{font-size:clamp(1.5rem,6vw,2.1rem);font-weight:700;letter-spacing:-.02em;color:var(--ok);
    margin:6px 0 10px;text-wrap:balance}
  .win p{color:var(--ink-2)}
  .dq{border:1px solid #E3B7B3;border-radius:10px;background:var(--alert-tint);padding:28px 22px;text-align:center}
  .dq .who{font-size:clamp(1.4rem,5.5vw,1.9rem);font-weight:700;letter-spacing:-.02em;color:var(--alert);
    margin:6px 0 10px;text-wrap:balance}
  .dq p{color:var(--ink-2)}
  tr.out td{background:var(--alert-tint)}
  tr.out .tname{color:var(--alert)}
  .strikes{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
  .strikes i{width:7px;height:7px;border-radius:50%;background:#E0E0E0;display:block}
  .strikes i.hit{background:var(--alert)}
  button.tiny{font-size:11px;padding:5px 12px;margin-left:8px}

  .prog{margin-top:16px;height:8px;border-radius:999px;background:#EDD7E7;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .45s ease}
  .prog i.fin{background:var(--ok)}
  @media (prefers-reduced-motion:reduce){ .prog i{transition:none} }

  .rail{display:flex;gap:3px;margin-top:16px}
  .rail i{flex:1;height:6px;border-radius:1px;background:#EDD7E7;display:block}
  .rail.mini{margin:6px 0 0;gap:2px}
  .rail.mini i{height:5px;background:#E8E8E8}
  .rail.mini i.on{background:var(--brand)}
  .rail.mini i.fin{background:var(--ok)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .stn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    display:flex;flex-direction:column;gap:2px}
  .stn.start{border-color:var(--brand-line);background:var(--brand-tint)}
  .stn.gold{border-color:#E8D48A;background:#FFFBEF}
  .stn .nm{font-weight:700;font-size:1rem}
  .stn .pn{font-family:var(--mono);font-size:10.5px;color:var(--aqua);word-break:break-all;line-height:1.45}
  .stn .note{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}

  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .nrow label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px}
  .nrow .cd{font-family:var(--mono);font-size:10.5px;color:var(--brand);margin-top:5px;letter-spacing:.06em}

  .mono-sm{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.5;
    word-break:break-word;margin-top:3px}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  thead th{background:var(--bg-2);font-size:10.5px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-2)}
  td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
  tr.done td{background:var(--ok-tint)}
  .tname{font-weight:700}

  details{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 16px}
  details[open]{padding-bottom:12px}
  summary{cursor:pointer;padding:13px 0;font-weight:700;font-size:.95rem}
  .keyline{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:8px 0;
    border-top:1px solid var(--line)}
  .keyline b{color:var(--ink);font-weight:700;min-width:110px}
  .keyline .cd{font-family:var(--mono);color:var(--brand);font-weight:600}
  .keyline .rt{color:var(--muted)}

  footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);
    font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .hint{color:var(--muted);font-size:.9rem}
  .lede{font-size:1rem;color:var(--ink-2)}
  @media (max-width:420px){ .mast img{height:26px} }

  /* display board — a read-only screen for a TV or projector. No controls,
     no station links, no team codes. */
  .wrap.board{max-width:1320px;padding-top:18px;padding-bottom:20px}
  .band.board .band-in{max-width:1320px;padding:20px 20px 22px}
  .band.board h1{font-size:clamp(1.6rem,3vw,2.3rem)}
  .band.board .sub{margin-top:5px}
  .band.board .kicker{margin-bottom:6px}
  .wrap.board footer{margin-top:16px;padding-top:12px}
  .bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:12px}
  .bd-row{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;
    border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:#fff}
  .bd-row.lead{border-color:var(--brand-line);background:var(--brand-tint)}
  .bd-row.done{border-color:#BFE3D2;background:var(--ok-tint)}
  .bd-row.out{border-color:#E3B7B3;background:var(--alert-tint)}
  .bd-pos{font-family:var(--mono);font-size:clamp(1.1rem,2vw,2rem);font-weight:700;
    color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
  .bd-row.lead .bd-pos{color:var(--brand)}
  .bd-name{font-size:clamp(1.02rem,1.7vw,1.72rem);font-weight:700;letter-spacing:-.01em;
    line-height:1.2;text-wrap:balance}
  .bd-where{font-size:clamp(.78rem,1vw,1.05rem);color:var(--muted);font-weight:600;margin-top:3px}
  .bd-bar{height:11px;border-radius:999px;background:#EDD7E7;overflow:hidden;margin-top:10px}
  .bd-bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .5s ease}
  .bd-row.done .bd-bar i{background:var(--ok)}
  .bd-row.out .bd-bar i{background:#D9A6A1}
  .bd-pct{font-family:var(--mono);font-size:clamp(1.3rem,2.6vw,2.5rem);font-weight:700;
    text-align:right;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums}
  .bd-row.done .bd-pct{color:var(--ok)}
  .bd-row.out .bd-pct{color:var(--alert)}
  .bd-note{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);text-align:right;margin-top:6px;white-space:nowrap}
  .bd-win{border:1px solid #BFE3D2;background:var(--ok-tint);border-radius:14px;padding:30px 24px;
    text-align:center;margin-bottom:16px}
  .bd-win .who{font-size:clamp(1.8rem,5.2vw,3.4rem);font-weight:700;color:var(--ok);
    letter-spacing:-.02em;margin:8px 0;text-wrap:balance}
  .bd-halt{border:1px solid var(--line-2);background:var(--bg-2);border-radius:14px;
    padding:26px 22px;text-align:center;margin-bottom:16px}
  .bd-halt h2{font-size:clamp(1.2rem,2.6vw,1.8rem)}
  @media (prefers-reduced-motion:reduce){ .bd-bar i{transition:none} }

  /* print view for the code slips */
  #slips{display:none}
  @media print{
    .mast,.band,#app,footer{display:none !important}
    #slips{display:block !important}
    @page{size:A4;margin:12mm}
  }
  #slips .slip{border-bottom:1px dashed #999;padding:10mm 0 8mm;page-break-inside:avoid}
  #slips .slip:nth-child(5n){page-break-after:always}
  #slips .sh{display:flex;align-items:center;gap:8mm}
  #slips .sh img{height:8mm}
  #slips .sn{font-size:20pt;font-weight:700}
  #slips .sc{font-family:var(--mono);font-size:17pt;font-weight:700;color:#B91D8F;margin:5mm 0 3mm}
  #slips .si{font-size:9pt;color:#444}
</style>
</head>

var TOTAL = DATA.total;
var TEAMS = DATA.teams;
var NAMES = {};
var CONFIG = null;
var LS = "eg-hunt-";
var view = "home";
var app = document.getElementById("app");
var bandEl = document.getElementById("band");
var adminKey = null;
var adminData = null;
var renderSeq = 0;   /* guards against two async renders interleaving */
var STRIKES = 3;     /* distinct wrong rooms before a team is out */
var enc = new TextEncoder();
var dec = new TextDecoder();

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function norm(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function b64(s){ var raw = atob(s), a = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) a[i] = raw.charCodeAt(i); return a; }
function slugName(slug){
  var base = String(slug||"").split("-")[0];
  return base ? base.charAt(0).toUpperCase() + base.slice(1) : "";
}
function clockOf(iso){ if(!iso) return "&mdash;";
  try{ return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }catch(e){ return "--:--"; } }
function pct(n){ return Math.round(n / TOTAL * 100); }
function barHTML(n,fin){
  return '<div class="prog" role="img" aria-label="'+pct(n)+' percent complete">'+
    '<i class="'+(fin?"fin":"")+'" style="width:'+pct(n)+'%"></i></div>';
}
function railHTML(n,done,mini){
  var out = '<div class="rail'+(mini?" mini":"")+'" aria-hidden="true">';
  for(var i=0;i<TOTAL;i++) out += '<i class="'+(i<n ? (done?"fin":"on") : "")+'"></i>';
  return out+"</div>";
}
function lsGet(k){ try{ var v = localStorage.getItem(LS+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(LS+k); }catch(e){} }
function teamName(id){
  if(NAMES && NAMES[id]) return NAMES[id];
  for(var i=0;i<TEAMS.length;i++) if(TEAMS[i].id===id) return TEAMS[i].n;
  return id;
}
function logoURI(){ var i = document.querySelector(".mast img"); return i ? i.src : ""; }

/* Wrong-scan buzzer. Phones only allow sound that a tap asked for, so the
   element is unlocked silently inside the submit handler and played later,
   once the answer is known. Vibration covers phones on silent. */
var buzzEl = document.getElementById("buzz");
var winEl  = document.getElementById("win");
var cueEl  = document.getElementById("cue");
var armed = false;
function primeOne(el){
  if(!el) return;
  try{
    el.muted = true;
    var p = el.play();
    if(p && p.then){
      p.then(function(){ el.pause(); el.currentTime = 0; el.muted = false; })
       .catch(function(){ el.muted = false; });
    } else {
      el.pause(); el.currentTime = 0; el.muted = false;
    }
  }catch(e){}
}
/* Both clips are unlocked together inside the one tap that submits a code,
   because by then we do not yet know whether it is a wrong room or the win. */
function primeSounds(){
  if(armed) return;
  armed = true;
  primeOne(buzzEl);
  primeOne(winEl);
  primeOne(cueEl);
}
function playClip(el, buzz){
  try{
    if(navigator.vibrate) navigator.vibrate(buzz ? [130,70,130,70,240] : [60,60,60,60,400]);
  }catch(e){}
  if(!el) return;
  try{
    if(buzz ? winEl : buzzEl){ var o = buzz ? winEl : buzzEl; o.pause(); o.currentTime = 0; }
  }catch(e){}
  try{
    el.muted = false;
    el.volume = 1;
    el.currentTime = 0;
    var p = el.play();
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}
function playBuzz(){ playClip(buzzEl, true); }
function playWin(){ playClip(winEl, false); }

/* Per-stop arrival sounds. Each clip is filed under a hash of that stop's
   secret address, never the address itself, so the bank gives nothing away to
   anyone reading this file. */
async function cueFor(slug){
  var bank = DATA.sfx || [];
  for(var i=0;i<bank.length;i++){
    if(await hashIs("sfx", slug, bank[i].h)) return bank[i].a;
  }
  return null;
}
async function playCue(slug){
  if(!cueEl) return;
  var clip = null;
  try{ clip = await cueFor(slug); }catch(e){}
  if(!clip) return;
  try{
    if(buzzEl){ buzzEl.pause(); }
    cueEl.muted = false;
    cueEl.volume = 1;
    cueEl.src = "data:audio/mpeg;base64," + clip;
    cueEl.currentTime = 0;
    var p = cueEl.play();
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}

function band(kicker, title, sub, wide){
  bandEl.className = "band" + (wide ? " wide" : "");
  bandEl.innerHTML = '<canvas id="cst" aria-hidden="true"></canvas><div class="band-in">'+
    '<p class="kicker">'+kicker+'</p><h1>'+title+
    (sub?'<span class="sub">'+sub+'</span>':'')+'</h1></div>';
  drawMotif();
}
function drawMotif(){
  var c = document.getElementById("cst");
  if(!c) return;
  var dpr = Math.min(window.devicePixelRatio||1,2);
  var w = bandEl.clientWidth, h = bandEl.clientHeight;
  c.width = Math.floor(w*dpr); c.height = Math.floor(h*dpr);
  var x = c.getContext("2d");
  x.scale(dpr,dpr);
  var pts = [], n = Math.max(6, Math.round(w/150));
  for(var i=0;i<n;i++) pts.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.6+.7});
  x.strokeStyle = "rgba(255,255,255,.26)"; x.lineWidth = 1;
  for(var j=1;j<pts.length;j++){
    var dx=pts[j].x-pts[j-1].x, dy=pts[j].y-pts[j-1].y;
    if(Math.sqrt(dx*dx+dy*dy) > 200) continue;
    x.beginPath(); x.moveTo(pts[j-1].x,pts[j-1].y); x.lineTo(pts[j].x,pts[j].y); x.stroke();
  }
  x.fillStyle = "rgba(255,255,255,.85)";
  pts.forEach(function(p){ x.beginPath(); x.arc(p.x,p.y,p.r,0,6.2832); x.fill(); });
}
addEventListener("resize", function(){ if(bandEl.firstChild) drawMotif(); });

/* ---------- crypto ---------- */
async function deriveKey(pw){
  var km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function openOne(key, blob){
  var raw = b64(blob);
  try{
    var out = await crypto.subtle.decrypt({name:"AES-GCM", iv:raw.slice(0,12)}, key, raw.slice(12));
    return JSON.parse(dec.decode(out));
  }catch(e){ return null; }
}
async function findRecord(key){
  for(var i=0;i<DATA.recs.length;i++){
    var p = await openOne(key, DATA.recs[i]);
    if(p) return p;
  }
  return null;
}
async function hashIs(prefix, slug, want){
  var h = await crypto.subtle.digest("SHA-256", enc.encode(prefix+"|"+slug));
  var a = new Uint8Array(h), s = "";
  for(var i=0;i<a.length;i++) s += String.fromCharCode(a[i]);
  return btoa(s) === want;
}
function isFinishSlug(slug){ return hashIs("finish", slug, DATA.finishHash); }
function isTreasureSlug(slug){ return hashIs("treasure", slug, DATA.treasureHash); }

/* ---------- shared run state ---------- */
function liveOn(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }
function supaHeaders(extra){
  var h = {"apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY,
           "Content-Type":"application/json"};
  if(extra) for(var k in extra) h[k] = extra[k];
  return h;
}
function cfgBlank(){ return {state:"running", winner_team:null, winner_name:null, won_at:null, names:{}}; }

async function loadConfig(){
  if(liveOn()){
    try{
      var r = await fetch(SUPABASE_URL+"/rest/v1/config?select=*&id=eq.hunt",{headers:supaHeaders()});
      if(r.ok){
        var rows = await r.json();
        if(rows && rows.length){
          var c = rows[0];
          var cfg = {state:c.state||"idle", winner_team:c.winner_team||null,
                     winner_name:c.winner_name||null, won_at:c.won_at||null,
                     names:(c.names && typeof c.names === "object") ? c.names : {}};
          lsSet("cfg", cfg);
          return cfg;
        }
      }
    }catch(e){}
    /* Unreachable: keep the last state this device saw rather than guessing. */
    return lsGet("cfg") || cfgBlank();
  }
  return lsGet("cfg") || cfgBlank();
}

async function patchConfig(fields, guard){
  if(!liveOn()){
    var c = Object.assign(lsGet("cfg") || cfgBlank(), fields);
    lsSet("cfg", c);
    return {ok:true, rows:[c]};
  }
  try{
    var r = await fetch(SUPABASE_URL+"/rest/v1/config?id=eq.hunt"+(guard||""), {
      method:"PATCH",
      headers:supaHeaders({"Prefer":"return=representation"}),
      body:JSON.stringify(fields)
    });
    if(!r.ok) return {ok:false, rows:[]};
    return {ok:true, rows: await r.json()};
  }catch(e){ return {ok:false, rows:[]}; }
}

async function refreshConfig(){
  CONFIG = await loadConfig();
  NAMES = CONFIG.names || {};
  return CONFIG;
}

/* ---------- progress store ---------- */
function blank(id){ return {team_id:id, team_name:teamName(id), visits:[], finished_at:null,
  wrongs:[], disqualified_at:null}; }

async function pushRec(rec){
  if(!liveOn()) return true;
  var last = rec.visits.length ? rec.visits[rec.visits.length-1] : null;
  var body = [{
    team_id: rec.team_id, team_name: rec.team_name,
    stops: rec.visits.length,
    last_room: last ? last.room : null,
    last_at: last ? last.at : null,
    finished_at: rec.finished_at,
    visits: rec.visits,
    wrongs: rec.wrongs || [],
    disqualified_at: rec.disqualified_at || null
  }];
  try{
    var r = await fetch(SUPABASE_URL+"/rest/v1/progress?on_conflict=team_id", {
      method:"POST",
      headers:supaHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify(body)
    });
    return r.ok;
  }catch(e){ return false; }
}

async function saveRec(rec){
  lsSet(rec.team_id, rec);
  return pushRec(rec);
}

/* True when the phone's history extends the server's rather than
   contradicting it. */
function prefixOk(localV, serverV){
  for(var i=0;i<serverV.length;i++){
    if(!localV[i] || localV[i].room !== serverV[i].room) return false;
  }
  return true;
}

async function loadRec(id){
  var local = lsGet(id);
  if(liveOn()){
    try{
      var r = await fetch(SUPABASE_URL+"/rest/v1/progress?select=*&team_id=eq."+encodeURIComponent(id),
        {headers:supaHeaders()});
      if(r.ok){
        var rows = await r.json();
        if(rows && rows.length){
          var row = rows[0];
          var srv = {team_id:id, team_name:row.team_name||teamName(id),
                     visits:Array.isArray(row.visits)?row.visits:[], finished_at:row.finished_at||null,
                     wrongs:Array.isArray(row.wrongs)?row.wrongs:[],
                     disqualified_at:row.disqualified_at||null};
          /* This phone logged stops the server never received (a connectivity
             blip). Push them before the route order is checked, so a dropout
             heals itself instead of blocking the next stop. */
          if(local && Array.isArray(local.visits) &&
             local.visits.length > srv.visits.length &&
             prefixOk(local.visits, srv.visits)){
            local.team_id = id;
            local.team_name = srv.team_name || local.team_name || teamName(id);
            if(srv.finished_at && !local.finished_at) local.finished_at = srv.finished_at;
            /* Strikes and disqualification belong to the server alone, so a
               phone catching up can never re-apply one an organizer cleared. */
            local.wrongs = srv.wrongs || [];
            local.disqualified_at = srv.disqualified_at || null;
            await pushRec(local);
            lsSet(id, local);
            return local;
          }
          lsSet(id, srv);
          return srv;
        }
        /* No row at all: nobody has started, or an organizer reset the hunt.
           Either way the server is right and this phone's copy goes. */
        lsDel(id); lsDel("held");
        return blank(id);
      }
    }catch(e){}
  }
  return local || blank(id);
}

async function loadAll(){
  if(liveOn()){
    try{
      var r = await fetch(SUPABASE_URL+"/rest/v1/progress?select=*", {headers:supaHeaders()});
      if(r.ok){
        var out = {}, rows = await r.json();
        rows.forEach(function(row){
          out[row.team_id] = {visits:Array.isArray(row.visits)?row.visits:[],
                              finished_at:row.finished_at||null,
                              wrongs:Array.isArray(row.wrongs)?row.wrongs:[],
                              disqualified_at:row.disqualified_at||null};
        });
        return {ok:true, recs:out};
      }
    }catch(e){}
    return {ok:false, recs:{}};
  }
  var local = {};
  TEAMS.forEach(function(t){
    var r = lsGet(t.id);
    if(r) local[t.id] = {visits:r.visits, finished_at:r.finished_at,
                         wrongs:r.wrongs||[], disqualified_at:r.disqualified_at||null};
  });
  return {ok:true, recs:local, localOnly:true};
}

/* ---------- routing ---------- */
function currentSlug(){
  var h = (location.hash||"").replace(/^#\/?/,"").trim().toLowerCase();
  return /^[a-z]+-[a-z0-9]{4,16}$/.test(h) ? h : "";
}
function boardRoute(){
  var h = (location.hash||"").replace(/^#\/?/,"").trim().toLowerCase();
  return h === "board" || h === "display";
}
function route(){
  if(boardRoute()){ renderBoard(); return; }
  var slug = currentSlug();
  if(slug) renderStation(slug); else renderHome();
}

}

      ? "You got to them first. Every code is now closed &mdash; the treasure is yours."

/* ---------- station ---------- */
async function renderStation(slug){
  var seq = ++renderSeq;
  view = "station"; app.className = "wrap";
  var treasure = await isTreasureSlug(slug);
  if(seq !== renderSeq) return;
  var name = treasure ? "The Keeper" : slugName(slug);

  band(treasure ? "Final code" : "Station", esc(name), "Checking the hunt&hellip;");
  app.innerHTML = '<div class="card"><p class="hint">Checking the hunt&hellip;</p></div>';

  await refreshConfig();
  if(seq !== renderSeq) return;

  /* Won: every code is a dead end from here on. */
  if(CONFIG.winner_team){
    band(treasure ? "Final code" : "Station", esc(name), "The hunt is over");
    app.innerHTML = winCard(CONFIG.winner_name || teamName(CONFIG.winner_team), false);
    return;
  }
  if(CONFIG.state !== "running"){
    band(treasure ? "Final code" : "Station", esc(name),
         CONFIG.state === "stopped" ? "Paused by the organizers" : "Not started yet");
    app.innerHTML = haltCard(CONFIG.state);
    return;
  }

  var saved = lsGet("me");
  band(treasure ? "Final code" : "Station", esc(name),
       treasure ? "You found them &mdash; enter your code to claim the treasure"
                : (saved ? "Collect your next clue" : "Enter your team code to begin"));

  app.innerHTML =
    '<div class="stack">'+
      (treasure ? '<div class="card tint"><div class="stack-sm"><h2>You have found the keeper of the treasure</h2>'+
        '<p class="hint">Enter your team code to claim it. Your route has to be complete first. The '+
        'first team to claim it wins, and every code in the building stops working.</p></div></div>' : '')+
      '<div class="card" id="fcard"><form id="f" class="stack-sm" autocomplete="off">'+
        (saved
          ? '<div class="row" style="justify-content:space-between"><span class="pill brand">'+esc(teamName(saved.id))+'</span>'+
            '<button type="button" class="link" id="switch">Not your team?</button></div>'
          : '<div><label class="fld" for="code">Team code</label>'+
            '<input id="code" name="code" type="text" spellcheck="false" maxlength="24" placeholder="16 characters"></div>')+
        '<div class="row"><button id="go" type="submit">'+
          (treasure ? "Claim the treasure" : (saved ? "Collect my clue" : "Start the hunt"))+'</button>'+
        '<span class="hint">'+(saved?"Remembered on this phone.":"Typed once, then remembered on this phone.")+'</span></div>'+
      '</form></div>'+
      '<div id="out"></div>'+
    '</div>'+
    '<footer><span>Solve it together &mdash; no code will skip you ahead.</span></footer>';

  var sw = document.getElementById("switch");
  if(sw) sw.addEventListener("click", function(){ lsDel("me"); lsDel("held"); renderStation(slug); });

  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    primeSounds();                     /* must happen inside the gesture */
    var el = document.getElementById("code");
    arrive(slug, el ? el.value : (saved ? saved.code : ""));
  });

  if(saved && !treasure) showHeld(saved);
}

async function showHeld(saved){
  var out = document.getElementById("out");
  if(!out || out.innerHTML) return;
  var rec = await loadRec(saved.id);
  /* Re-check after the round trip: if the player tapped the button while this
     was in flight, that result owns the panel and must not be overwritten. */
  var still = document.getElementById("out");
  if(still !== out || out.innerHTML) return;
  if(rec.disqualified_at){ showDQ(out, saved.id, rec); return; }
  if(!rec.visits.length) return;
  if(rec.finished_at){ out.innerHTML = finishCard(saved.id, rec.finished_at); return; }
  var held = lsGet("held");
  if(held && held.step === rec.visits.length)
    out.innerHTML = clueCard(held.clue, held.step, rec.visits.length, "Clue you are holding");
}

async function arrive(slug, rawCode){
  var out = document.getElementById("out");
  var btn = document.getElementById("go");
  var code = norm(rawCode);
  if(code.length < 8){
    out.innerHTML = '<div class="msg bad">A team code is 16 letters and digits. Check the slip you were handed.</div>';
    return;
  }
  btn.disabled = true;
  out.innerHTML = '<div class="msg">Checking your route&hellip;</div>';

  var payload;
  try{
    var key = await deriveKey(code + "|" + slug);
    payload = await findRecord(key);
  }catch(e){
    btn.disabled = false;
    out.innerHTML = '<div class="msg bad">This browser blocked the code check. Try Chrome or Safari, or ask an organizer.</div>';
    return;
  }
  btn.disabled = false;

  if(!payload){
    out.innerHTML = '<div class="msg bad">No clue here for that code. Either a character is mistyped, '+
      'or '+esc(slugName(slug))+' is not a stop on your route.</div>';
    return;
  }

  lsSet("me", {id:payload.t, code:code});

  if(payload.w){ return claim(payload); }

  var rec0 = await loadRec(payload.t);
  if(rec0.disqualified_at){
    playBuzz();
    showDQ(out, payload.t, rec0);
    return;
  }
  var done = rec0.visits.length;
  var step = payload.s;

  if(done >= TOTAL && await isFinishSlug(slug)){
    if(!rec0.finished_at){
      rec0.finished_at = new Date().toISOString();
      rec0.team_name = payload.n;
      await saveRec(rec0);
    }
    out.innerHTML = finishCard(payload.t, rec0.finished_at);
    return;
  }
  if(step <= done){
    out.innerHTML = clueCard(payload.c, step, done, "Clue re-issued");
    return;
  }
  if(step > done + 1){
    playBuzz();
    var wrongs = Array.isArray(rec0.wrongs) ? rec0.wrongs.slice() : [];
    /* Count each wrong room once, so a double tap on one poster is one strike. */
    var fresh = wrongs.indexOf(payload.r) === -1;
    if(fresh) wrongs.push(payload.r);
    rec0.wrongs = wrongs;
    rec0.team_name = teamName(payload.t);
    if(wrongs.length >= STRIKES && !rec0.disqualified_at){
      rec0.disqualified_at = new Date().toISOString();
    }
    await saveRec(rec0);
    if(rec0.disqualified_at){
      showDQ(out, payload.t, rec0);
      return;
    }
    var left = STRIKES - wrongs.length;
    out.innerHTML = '<div class="msg bad"><strong>'+esc(payload.r)+' is not your next stop.</strong><br>'+
      esc(teamName(payload.t))+' is '+pct(done)+'% of the way round &mdash; solve the clue you are holding first.'+
      (fresh
        ? '<br><br>Wrong scan '+wrongs.length+' of '+STRIKES+'. '+
          (left === 1 ? 'One more and your team is out.' : left+' more and your team is out.')
        : '<br><br>You have already scanned this one. It still counts as wrong scan '+wrongs.length+' of '+STRIKES+'.')+
      '</div>';
    return;
  }

  rec0.team_name = teamName(payload.t);
  rec0.visits.push({room:payload.r, step:step, at:new Date().toISOString()});
  lsSet("held", {step:step, clue:payload.c});
  var ok = await saveRec(rec0);
  playCue(slug);
  out.innerHTML = clueCard(payload.c, step, rec0.visits.length, step===1 ? "You are away" : esc(payload.r)+" logged") +
    (ok ? "" : '<div class="msg bad" style="margin-top:12px">Your clue is above, but the tracker did not '+
      'record this stop. Show this screen to an organizer.</div>');
}

/* The treasure. First valid code through this door wins and closes the hunt.
   The guard on the PATCH means the database itself picks the winner, so two
   phones scanning together cannot both be told they won. */
async function claim(payload){
  var out = document.getElementById("out");
  out.innerHTML = '<div class="msg">Checking your route&hellip;</div>';

  /* The treasure only counts once a team has actually walked its whole route,
     so stumbling across the prize early wins nothing. */
  var rec = await loadRec(payload.t);
  if(rec.disqualified_at){
    playBuzz();
    showDQ(out, payload.t, rec);
    return;
  }
  if(rec.visits.length < TOTAL){
    out.innerHTML = '<div class="msg bad">You have found the keeper, but '+esc(teamName(payload.t))+
      ' is only '+pct(rec.visits.length)+'% of the way round. Finish your route, then come back and '+
      'claim it.</div>';
    return;
  }

  out.innerHTML = '<div class="msg">Claiming the treasure&hellip;</div>';
  var now = new Date().toISOString();

  /* Record the route as complete too, in case they reached the prize before
     re-scanning the Canteen. */
  if(!rec.finished_at){
    rec.finished_at = now;
    rec.team_name = teamName(payload.t);
    await saveRec(rec);
  }
  var res = await patchConfig({
    winner_team: payload.t,
    winner_name: teamName(payload.t),
    won_at: now,
    state: "stopped",
    stopped_at: now
  }, "&winner_team=is.null");

  await refreshConfig();

  if(!CONFIG.winner_team){
    out.innerHTML = '<div class="msg bad">Could not reach the tracker to record the win. '+
      'Show this screen to an organizer &mdash; do not scan again.</div>';
    return;
  }
  var mine = (res.rows && res.rows.length > 0) && CONFIG.winner_team === payload.t;
  if(mine) playWin();
  out.innerHTML = winCard(CONFIG.winner_name || teamName(CONFIG.winner_team), mine);
}

function clueCard(text, step, done, badge){
  var last = step === TOTAL;
  return '<div class="clue-card">'+
    '<div class="clue-head"><span class="pill '+(last?"brand":"good")+'">'+badge+'</span>'+
    '<span class="tag">'+pct(done)+'% complete</span></div>'+
    '<p class="clue">'+esc(text)+'</p>'+
    '<p class="hint" style="margin-top:14px">'+(last
      ? "This last one is not a place &mdash; it names a person, and they are somewhere in this "+
        "building holding the treasure. Work out who, find them, and scan the code they are carrying."
      : "The answer is a place on this floor. Go there and scan the QR code on its poster.")+'</p>'+
    barHTML(done,false)+'</div>';
}

function showDQ(out, id, rec){
  var f = document.getElementById("fcard");
  if(f) f.style.display = "none";          /* no point offering another scan */
  out.innerHTML = dqCard(id, rec);
}

function dqCard(id, rec){
  var w = (rec && rec.wrongs) || [];
  return '<div class="dq">'+
    '<span class="pill bad">Disqualified</span>'+
    '<div class="who">'+esc(teamName(id))+' is out</div>'+
    '<p>Three wrong scans ends a team&rsquo;s run. Your clues are closed.'+
    (w.length ? ' Wrong scans: '+w.map(esc).join(', ')+'.' : '')+'</p>'+
    '<p class="hint" style="margin-top:10px">If you think this is a mistake, show this screen to an organizer '+
    '&mdash; they can put you back in.</p></div>';
}

function finishCard(id, at){
  return '<div class="clue-card" style="border-left-color:var(--ok);background:var(--ok-tint);border-color:#BFE3D2">'+
    '<div class="clue-head"><span class="pill good">Route complete</span>'+
    '<span class="tag" style="color:var(--ok)">'+esc(teamName(id))+' &middot; '+clockOf(at)+'</span></div>'+
    '<p class="clue">Every stop, done. Now solve your last clue, find the person it names, and scan the code they are carrying.</p>'+
    barHTML(TOTAL,true)+'</div>';
}

/* ---------- team names ---------- */
function renderTeams(){
  view = "teams"; app.className = "wrap wide";
  if(!adminData){ renderGate(); return; }
  stopPoll();
  band("Organizers", "Team names", "Rename the teams, then print their code slips", true);

  app.innerHTML =
    '<div class="stack">'+
      '<p class="lede">Names appear on the tracker, on each team&rsquo;s phone and on their code slips. '+
      'The codes themselves never change, so posters already on the walls stay valid.</p>'+
      '<div class="card"><div class="names" id="nm"></div></div>'+
      '<div class="card flat"><div class="stack-sm">'+
        '<div class="row"><button id="save">Save names &amp; make slips</button>'+
        '<button class="ghost" id="saveonly">Save names only</button>'+
        '<button class="ghost" id="back">Back to tracker</button></div>'+
        '<p class="hint" id="nmsg">The slips download as a PDF. If your network blocks the PDF library, '+
        'a print view opens instead &mdash; choose &ldquo;Save as PDF&rdquo; in the print dialog.</p>'+
      '</div></div>'+
    '</div>';

  document.getElementById("nm").innerHTML = TEAMS.map(function(t){
    return '<div class="nrow"><label for="n_'+t.id+'">'+esc(t.n)+'</label>'+
      '<input class="txt" id="n_'+t.id+'" type="text" maxlength="28" value="'+esc(teamName(t.id))+'" '+
      'placeholder="'+esc(t.n)+'">'+
      '<div class="cd">'+esc((adminData.codes||{})[t.id]||"")+'</div></div>';
  }).join("");

  function collect(){
    var out = {};
    TEAMS.forEach(function(t){
      var el = document.getElementById("n_"+t.id);
      var v = (el && el.value || "").trim().replace(/\s+/g," ");
      if(v) out[t.id] = v;
    });
    return out;
  }
  async function persist(){
    var msg = document.getElementById("nmsg");
    msg.textContent = "Saving…";
    var names = collect();
    var res = await patchConfig({names:names});
    if(!res.ok){ msg.textContent = "Could not save to the tracker. Check the connection and try again."; return false; }
    await refreshConfig();
    msg.textContent = "Saved. Every phone picks the new names up on its next scan.";
    return true;
  }

  document.getElementById("saveonly").addEventListener("click", persist);
  document.getElementById("save").addEventListener("click", async function(){
    if(await persist()) makeSlips();
  });
  document.getElementById("back").addEventListener("click", renderTracker);
}

/* Code slips. jsPDF gives a one-click download; the print view is the
   no-dependency fallback and works even offline. */
function slipRows(){
  return TEAMS.map(function(t){
    return {name:teamName(t.id), code:(adminData.codes||{})[t.id]||""};
  });
}
function makeSlips(){
  var msg = document.getElementById("nmsg");
  var rows = slipRows();
  var J = window.jspdf && window.jspdf.jsPDF;
  if(!J){ if(msg) msg.textContent = "PDF library unavailable, opening the print view instead."; return printSlips(); }
  try{
    var doc = new J({unit:"mm", format:"a4"});
    var W = 210, H = 297, slot = (H - 28) / 5, logo = logoURI();
    rows.forEach(function(r, i){
      var page = Math.floor(i/5), j = i % 5;
      if(j === 0){
        if(page) doc.addPage();
        doc.setFillColor(185,29,143); doc.rect(0,0,W,6,"F");
        doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(110,110,110);
        doc.text("TEAM CODE SLIPS  -  CUT ALONG THE LINES", 18, 13);
      }
      var top = 24 + j*slot;
      doc.setDrawColor(170,170,170); doc.setLineWidth(0.2);
      doc.setLineDashPattern([1,1],0); doc.line(12, top, W-12, top); doc.setLineDashPattern([],0);
      if(logo){ try{ doc.addImage(logo, "PNG", 22, top+4, 7*(626/188), 7); }catch(e){} }
      doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(20,20,20);
      doc.text(r.name, 22 + 7*(626/188) + 8, top + 11);
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(70,70,70);
      doc.text("Scan the QR code in the Canteen, then type this code once.", 22, top + 21);
      doc.setFont("courier","bold"); doc.setFontSize(19); doc.setTextColor(185,29,143);
      doc.text(r.code, 22, top + 32);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(70,70,70);
      doc.text("Your phone remembers it. Keep this slip to yourselves.", 22, top + 40);
    });
    doc.save("eGain_Team_Code_Slips.pdf");
    if(msg) msg.textContent = "Slips downloaded as eGain_Team_Code_Slips.pdf.";
  }catch(e){
    if(msg) msg.textContent = "Could not build the PDF, opening the print view instead.";
    printSlips();
  }
}
function printSlips(){
  var logo = logoURI();
  document.getElementById("slips").innerHTML = slipRows().map(function(r){
    return '<div class="slip"><div class="sh">'+(logo?'<img src="'+logo+'" alt="eGain">':'')+
      '<span class="sn">'+esc(r.name)+'</span></div>'+
      '<div class="si">Scan the QR code in the Canteen, then type this code once.</div>'+
      '<div class="sc">'+esc(r.code)+'</div>'+
      '<div class="si">Your phone remembers it. Keep this slip to yourselves.</div></div>';
  }).join("");
  window.print();
}

/* ---------- tracker ---------- */
var poll = null;

function statePill(){
  if(CONFIG && CONFIG.winner_team) return '<span class="pill good">Won &middot; '+esc(CONFIG.winner_name||"")+'</span>';
  if(CONFIG && CONFIG.state === "running") return '<span class="pill brand">Running</span>';
  if(CONFIG && CONFIG.state === "stopped") return '<span class="pill bad">Stopped</span>';
  return '<span class="pill">Not started</span>';
}

function renderTracker(){
  view = "tracker"; app.className = "wrap wide";
  if(!adminData){ renderGate(); return; }
  band("Organizers", "Tracker", "Live positions for every team", true);

  app.innerHTML =
    '<div class="stack">'+
      '<div class="card"><div class="stack-sm">'+
        '<div class="row" style="justify-content:space-between">'+
          '<h2>Run control</h2><span id="spill">'+statePill()+'</span></div>'+
        '<p class="hint" id="rcmsg"></p>'+
        '<div class="row"><button class="go" id="btnStart">Start the hunt</button>'+
        '<button class="danger" id="btnStop">Stop the hunt</button>'+
        '<button class="ghost" id="btnTeams">Team names</button>'+
        '<button class="ghost" id="btnBoard">Open display board</button></div>'+
        '<p class="hint">The display board is the standings on their own, with no controls, no station '+
        'links and no team codes &mdash; safe to leave on a screen. It lives at '+
        '<span class="mono-sm">'+esc(location.href.split("#")[0].split("?")[0]+"#/board")+'</span>.</p>'+
      '</div></div>'+
      '<div class="card" style="padding:0;overflow:hidden"><div class="scroller"><table id="tbl">'+
        '<thead><tr><th>Team</th><th>Clues unlocked</th><th>Last confirmed at</th>'+
        '<th>Next stop due</th><th>Wrong scans</th><th>Time</th></tr></thead><tbody></tbody></table></div></div>'+
      '<div class="stack-sm"><h2>Station links</h2>'+
        '<p class="hint">One QR code per room, plus the treasure. Keep this screen away from players.</p>'+
        '<div class="grid" id="stns"></div></div>'+
      '<details><summary>Route key and team codes</summary><div id="routes"></div></details>'+
      '<div class="card flat"><div class="stack-sm"><h2>Reset the hunt</h2>'+
        '<p class="hint">Clears every team&rsquo;s progress, the winner and the clock, and puts the hunt back '+
        'to not started. Use it after a practice run, not mid-game.</p>'+
        '<div class="row"><button id="rst" class="danger">Clear all progress</button>'+
        '<span class="hint" id="rmsg"></span></div>'+
      '</div></div>'+
    '</div>'+
    '<footer><span id="conn" class="pill">Loading&hellip;</span><span>'+(liveOn()
      ? "Refreshes every few seconds. Times use each team&rsquo;s phone clock."
      : "No backend configured, so this shows only what happened on this device.")+'</span></footer>';

  document.getElementById("btnTeams").addEventListener("click", renderTeams);
  document.getElementById("btnBoard").addEventListener("click", function(){
    window.open(location.href.split("#")[0].split("?")[0] + "#/board", "_blank", "noopener");
  });

  /* Delegated: the table body is rewritten on every refresh. */
  document.getElementById("tbl").addEventListener("click", async function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest("button[data-reinstate]") : null;
    if(!b) return;
    var id = b.getAttribute("data-reinstate");
    b.disabled = true; b.textContent = "Working…";
    var rec = await loadRec(id);
    rec.wrongs = [];
    rec.disqualified_at = null;
    rec.team_name = teamName(id);
    await saveRec(rec);
    lsDel(id);
    paintRefresh();
  });

  var base = location.href.split("#")[0].split("?")[0];
  var stns = adminData.stations.map(function(s,i){
    return '<div class="stn'+(i===0?" start":"")+'"><div class="nm">'+esc(s.name)+'</div>'+
      '<div class="pn">'+esc(base+"#/"+s.slug)+'</div>'+
      (i===0?'<div class="note">start + finish line</div>':'')+'</div>';
  });
  if(adminData.treasure){
    stns.push('<div class="stn gold"><div class="nm">The Treasure &mdash; carried by Maitreya</div>'+
      '<div class="pn">'+esc(base+"#/"+adminData.treasure)+'</div>'+
      '<div class="note">winning code &middot; ends the hunt</div></div>');
  }
  document.getElementById("stns").innerHTML = stns.join("");

  document.getElementById("routes").innerHTML = TEAMS.map(function(t){
    var r = adminData.routes[t.id] || [];
    return '<div class="keyline"><b>'+esc(teamName(t.id))+'</b><span class="cd">'+
      esc((adminData.codes||{})[t.id]||"")+'</span><span class="rt">'+r.map(esc).join(" &rarr; ")+
      ' &rarr; Canteen</span></div>';
  }).join("");

  async function setState(fields, note){
    var m = document.getElementById("rcmsg");
    m.textContent = "Working…";
    var res = await patchConfig(fields);
    await refreshConfig();
    document.getElementById("spill").innerHTML = statePill();
    m.textContent = res.ok ? note : "Could not reach the tracker. Try again.";
    paintRefresh();
  }
  document.getElementById("btnStart").addEventListener("click", function(){
    var now = new Date().toISOString();
    setState({state:"running", started_at:now, stopped_at:null,
              winner_team:null, winner_name:null, won_at:null},
             "Hunt running. Room codes are live.");
  });
  document.getElementById("btnStop").addEventListener("click", function(){
    setState({state:"stopped", stopped_at:new Date().toISOString()},
             "Hunt stopped. Every code now shows the paused message.");
  });

  var rbtn = document.getElementById("rst"), armed = false;
  rbtn.addEventListener("click", async function(){
    if(!armed){ armed = true; rbtn.textContent = "Tap again to confirm";
      document.getElementById("rmsg").textContent = "This cannot be undone."; return; }
    rbtn.disabled = true;
    document.getElementById("rmsg").textContent = "Clearing…";
    for(var i=0;i<TEAMS.length;i++){
      lsDel(TEAMS[i].id);
      if(liveOn()){
        try{
          await fetch(SUPABASE_URL+"/rest/v1/progress?team_id=eq."+encodeURIComponent(TEAMS[i].id),
            {method:"DELETE", headers:supaHeaders({"Prefer":"return=minimal"})});
        }catch(e){}
      }
    }
    lsDel("held");
    await patchConfig({state:"idle", started_at:null, stopped_at:null,
                       winner_team:null, winner_name:null, won_at:null});
    await refreshConfig();
    document.getElementById("spill").innerHTML = statePill();
    rbtn.disabled = false; armed = false; rbtn.textContent = "Clear all progress";
    document.getElementById("rmsg").textContent = "Progress cleared. Hunt set back to not started.";
    paintRefresh();
  });

  paint({});
  paintRefresh();
  stopPoll();
  if(liveOn()) poll = setInterval(paintRefresh, 6000);
}

function stopPoll(){ if(poll){ clearInterval(poll); poll = null; } }

async function paintRefresh(){
  if(view !== "tracker"){ stopPoll(); return; }
  var res = await loadAll();
  await refreshConfig();
  var conn = document.getElementById("conn");
  if(conn){
    if(res.localOnly){ conn.textContent = "This device only"; conn.className = "pill aqua"; }
    else if(res.ok){ conn.textContent = "Live"; conn.className = "pill good"; }
    else { conn.textContent = "Backend unreachable"; conn.className = "pill bad"; }
  }
  var sp = document.getElementById("spill");
  if(sp) sp.innerHTML = statePill();
  paint(res.recs);
}

function paint(recs){
  var tb = document.querySelector("#tbl tbody");
  if(!tb) return;
  var rows = TEAMS.map(function(t){
    var r = recs[t.id] || {};
    var v = Array.isArray(r.visits) ? r.visits : [];
    return {t:t, n:v.length, fin:r.finished_at||null, last:v.length?v[v.length-1]:null,
            wrongs:Array.isArray(r.wrongs)?r.wrongs:[], out:r.disqualified_at||null};
  });
  rows.sort(function(a,b){
    if(!!a.out !== !!b.out) return a.out ? 1 : -1;          /* the disqualified sink */
    var aw = CONFIG && CONFIG.winner_team === a.t.id, bw = CONFIG && CONFIG.winner_team === b.t.id;
    if(aw !== bw) return aw ? -1 : 1;
    if(!!a.fin !== !!b.fin) return a.fin ? -1 : 1;
    if(a.fin && b.fin) return a.fin < b.fin ? -1 : 1;
    if(a.n !== b.n) return b.n - a.n;
    if(a.last && b.last) return a.last.at < b.last.at ? -1 : 1;
    return 0;
  });

  tb.innerHTML = rows.map(function(x){
    var where, due, route = (adminData && adminData.routes[x.t.id]) || [];
    var won = CONFIG && CONFIG.winner_team === x.t.id;
    if(x.out){ where = '<span class="pill bad">Disqualified</span>'; due = "&mdash;"; }
    else if(won){ where = '<span class="pill good">Treasure claimed</span>'; due = "&mdash;"; }
    else if(x.fin){ where = '<span class="pill good">Route complete</span>'; due = "Maitreya"; }
    else if(x.n === 0){ where = '<span class="pill">Not started</span>'; due = route[0] || "Canteen"; }
    else if(x.n >= TOTAL){ where = esc(x.last.room)+' <span class="pill brand">final clue</span>'; due = "Maitreya"; }
    else { where = esc(x.last.room); due = esc(route[x.n] || "?"); }
    var dots = '<span class="strikes" aria-hidden="true">';
    for(var s=0;s<STRIKES;s++) dots += '<i class="'+(s < x.wrongs.length ? "hit" : "")+'"></i>';
    dots += '</span>';
    var strikeCell = '<span class="num">'+x.wrongs.length+' / '+STRIKES+'</span>'+dots+
      (x.out ? '<button class="danger tiny" data-reinstate="'+esc(x.t.id)+'">Reinstate</button>' : '');
    return '<tr class="'+(x.out ? "out" : (won||x.fin ? "done" : ""))+'">'+
      '<td><div class="tname">'+esc(teamName(x.t.id))+'</div>'+
      (x.wrongs.length ? '<div class="mono-sm">'+esc(x.wrongs.join(", "))+'</div>' : '')+'</td>'+
      '<td style="min-width:170px"><span class="num">'+x.n+' / '+TOTAL+'</span>'+railHTML(x.n,!!x.fin,true)+'</td>'+
      '<td>'+where+'</td><td>'+due+'</td>'+
      '<td style="min-width:150px">'+strikeCell+'</td>'+
      '<td class="num">'+(won ? clockOf(CONFIG.won_at)
                              : (x.fin ? clockOf(x.fin) : (x.last ? clockOf(x.last.at) : "&mdash;")))+'</td></tr>';
  }).join("");
}


/* ---------- display board ----------
   A standings screen with nothing secret on it: no station links, no team
   codes, no route key and no run controls. Safe to leave on a TV. */
function boardRank(recs){
  var rows = TEAMS.map(function(t){
    var r = recs[t.id] || {};
    var v = Array.isArray(r.visits) ? r.visits : [];
    return {id:t.id, n:v.length, fin:r.finished_at||null, last:v.length?v[v.length-1]:null,
            wrongs:Array.isArray(r.wrongs)?r.wrongs:[], out:r.disqualified_at||null};
  });
  rows.sort(function(a,b){
    if(!!a.out !== !!b.out) return a.out ? 1 : -1;
    var aw = CONFIG && CONFIG.winner_team === a.id, bw = CONFIG && CONFIG.winner_team === b.id;
    if(aw !== bw) return aw ? -1 : 1;
    if(!!a.fin !== !!b.fin) return a.fin ? -1 : 1;
    if(a.fin && b.fin) return a.fin < b.fin ? -1 : 1;
    if(a.n !== b.n) return b.n - a.n;
    if(a.last && b.last) return a.last.at < b.last.at ? -1 : 1;
    return 0;
  });
  return rows;
}

function boardRowHTML(x, i){
  var won = CONFIG && CONFIG.winner_team === x.id;
  var cls = x.out ? "out" : (won || x.fin ? "done" : (i === 0 && x.n > 0 ? "lead" : ""));
  var where;
  if(x.out) where = "Out &mdash; " + x.wrongs.length + " wrong scans";
  else if(won) where = "Treasure claimed &middot; " + clockOf(CONFIG.won_at);
  else if(x.fin) where = "Route complete &middot; hunting Maitreya &middot; " + clockOf(x.fin);
  else if(x.n === 0) where = "Not started";
  else where = "Last confirmed at " + esc(x.last.room) + " &middot; " + clockOf(x.last.at);
  if(!x.out && !won && x.wrongs.length) where += " &middot; " + x.wrongs.length + "/" + STRIKES + " wrong";
  var p = x.out ? 0 : pct(x.n);
  return '<div class="bd-row '+cls+'">'+
      '<div class="bd-pos">'+(x.out ? "&mdash;" : (i+1))+'</div>'+
      '<div><div class="bd-name">'+esc(teamName(x.id))+'</div>'+
        '<div class="bd-where">'+where+'</div>'+
        '<div class="bd-bar"><i style="width:'+p+'%"></i></div></div>'+
      '<div><div class="bd-pct">'+(x.out ? "OUT" : p+"%")+'</div>'+
        '<div class="bd-note">'+x.n+' of '+TOTAL+'</div></div>'+
    '</div>';
}

var boardWon = null;   /* so the fanfare fires once, not on every refresh */

function paintBoard(recs, conn){
  var head = document.getElementById("bdtop");
  var list = document.getElementById("bdlist");
  if(!head || !list) return;

  if(CONFIG && CONFIG.winner_team){
    var nm = CONFIG.winner_name || teamName(CONFIG.winner_team);
    head.innerHTML = '<div class="bd-win"><span class="pill good">The treasure is claimed</span>'+
      '<div class="who">'+esc(nm)+'</div><p>Every code in the building is now closed.</p></div>';
    if(boardWon !== CONFIG.winner_team){ boardWon = CONFIG.winner_team; playWin(); }
  } else if(CONFIG && CONFIG.state !== "running"){
    head.innerHTML = '<div class="bd-halt"><h2>'+(CONFIG.state === "stopped"
      ? "The hunt is paused" : "The hunt has not started yet")+'</h2>'+
      '<p class="hint">Standings stay on screen and pick up again the moment the organizers restart it.</p></div>';
  } else {
    head.innerHTML = "";
  }

  var rows = boardRank(recs);
  list.innerHTML = rows.map(boardRowHTML).join("");

  var c = document.getElementById("bconn");
  if(c){
    if(conn === "local"){ c.innerHTML = "This device only"; c.className = "pill aqua"; }
    else if(conn === "ok"){ c.innerHTML = "Live &middot; updated " + clockOf(new Date().toISOString());
                            c.className = "pill good"; }
    else if(conn === "bad"){ c.innerHTML = "Reconnecting"; c.className = "pill bad"; }
    else { c.innerHTML = "Loading&hellip;"; c.className = "pill"; }
  }
}

async function boardRefresh(){
  if(view !== "board"){ stopPoll(); return; }
  var res = await loadAll();
  await refreshConfig();
  if(view !== "board") return;
  paintBoard(res.recs, res.localOnly ? "local" : (res.ok ? "ok" : "bad"));
}

function renderBoard(){
  view = "board"; app.className = "wrap wide board";
  band("eGain &middot; Internal event", "Live standings",
       "Clues unlocked by every team, refreshed as they scan", true);
  bandEl.className += " board";
  app.innerHTML =
    '<div class="stack">'+
      '<div id="bdtop"></div>'+
      '<div class="bd" id="bdlist"></div>'+
    '</div>'+
    '<footer><span id="bconn" class="pill">Loading&hellip;</span>'+
    '<button class="link" id="bsound">Turn sound on</button></footer>';

  /* A screen cannot play the winning horn unless somebody has tapped it once. */
  var sb = document.getElementById("bsound");
  sb.addEventListener("click", function(){
    primeSounds();
    sb.textContent = "Sound is on";
    sb.disabled = true;
  });

  boardWon = (CONFIG && CONFIG.winner_team) || null;
  paintBoard({}, null);
  boardRefresh();
  stopPoll();
  if(liveOn()) poll = setInterval(boardRefresh, 5000);
}

/* ---------- boot ---------- */
addEventListener("hashchange", function(){ stopPoll(); route(); });
try{ sessionStorage.removeItem(LS+"admin"); }catch(e){}
NAMES = (lsGet("cfg") || {}).names || {};
route();
